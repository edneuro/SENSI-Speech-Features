# ============================ TEMPLATE ============================
# Copy this file to config/run.yaml and edit — machine-specific run
# settings (folders, analyzer name, token-file path). Regenerate:
#     python scripts/export_default_config.py
# ==================================================================
# SENSI SpeechFeatures run config (run.yaml) — machine/run-specific.
# Folders, analyzer name, theme, token-file paths. Never touched by the
# GUI's "Reset settings".
# Comments are regenerated on every save; hand-added comments do not survive.

# Machine-specific: folders, analyzer name, theme, token-file paths.
shared:
  analyzer_name: ''  # required: your name or initials, recorded in the run log
  last_transcripts_folder: ''  # folder of .txt transcripts (run.py needs it)
  last_audio_folder: ''  # folder of .wav files; '' = text-only run
  last_output_folder: ''  # folder the outputs go to (run.py needs it)
  theme: system  # not used (the app has one light theme)
  hf_token_file: hf_token.txt  # text file holding your HuggingFace token; a relative path is inside config/
