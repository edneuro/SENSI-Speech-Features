# Predictability roster: models (slugs), metrics, per-model context caps.
predictability:
  models: []
  metrics:
    surprisal: false
    cloze: false
    topmatch: false
  context: {}

# Semantic-indicator backend + category multi-selects.
semantic:
  backend: empath
  categories_liwc:
  - affect
  - cogproc
  - emo_pos
  - emo_neg
  - body
  - motion
  - percept
  - time
  - space
  - work
  - family
  - money
  - relig
  - focuspresent
  - social
  categories_empath:
  - friends
  - philosophy
  - positive_emotion
  - negative_emotion
  - body
  - movement
  - hearing
  - anticipation
  - science
  - work
  - family
  - communication
  - money

# Output artifacts: per-level CSV/.mat toggles + doc-level column groups.
output:
  word_level_csv: true
  document_summary: false
  out_count_tokens: false
  out_count_content_tokens: false
  out_count_sentences: false
  out_count_paragraphs: false
  doc_lex_diversity: false
  doc_readability: false
  doc_category_proportions: false
  syllables_csv: false
  phonemes_csv: false
  doc_agg_zipf_freq: false
  doc_agg_edu_zipf: false
  doc_agg_predictability: false
  master_doc_prosody: true
  master_doc_articulation_rate: true
  master_doc_counts: true
  sentences_csv: false
  word2vec_mat: false
  bert_word_mat: false
  bert_sentence_mat: false
  doc_agg_lexical_norms: false
  acoustic_ts_mat: false
  phoneme_surprisal_mat: false

# Praat pitch/pause parameters + p-center k.
prosody:
  pitch_units: semitones
  pitch_floor_hz: 75
  pitch_ceiling_hz: 500
  pause_threshold_s: 0.25
  pcenter_k: 0.3

# Lexical-norm table paths + late-AoA threshold.
lexical_norms:
  paths: {}
  late_acquired_threshold: 10

# Acoustic time-series (TRF) parameters.
acoustic_ts:
  analysis_rate: 128
  env_method: rms
  env_comp: 0.3010299956639812
  env_window: 1.0
  n_mels: 16
  n_mfcc: 13
  mel_preset: speech

# Phoneme surprisal / cohort entropy parameters.
phoneme_surprisal:
  analysis_sr: 128
  strip_stress: true
  primary_only: true

# Forced-alignment options (MFA G2P for out-of-dictionary words).
alignment:
  g2p_oov: false
