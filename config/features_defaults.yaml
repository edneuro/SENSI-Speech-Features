# Praat pitch/pause parameters + p-center k.
prosody:
  pitch_units: semitones  # semitones | hz
  pitch_floor_hz: 75  # Hz, below pitch_ceiling_hz (GUI range 20-400)
  pitch_ceiling_hz: 500  # Hz, above pitch_floor_hz (GUI range 100-1200)
  pause_threshold_s: 0.25  # seconds, greater than 0 (GUI range 0.05-5)
  pcenter_k: 0.3  # 0 to 1

# Lexical-norm table paths + late-AoA threshold.
lexical_norms:
  paths: {}  # optional {source: file path} overrides; sources: aoa, concreteness, mrc, warriner; {} = the default files in data/dictionaries/
  late_acquired_threshold: 10  # age in years, 0 or more (GUI range 0-25)

# Acoustic time-series (TRF) parameters.
acoustic_ts:
  analysis_rate: 128  # Hz, greater than 0 (GUI range 1-2000)
  env_method: rms  # rms | hilbert
  env_comp: 0.3010299956639812  # compression exponent, greater than 0 (GUI range 0.01-2; default log10(2), as in mTRF)
  env_window: 1.0  # averaging width in output samples (GUI range 1-16)
  n_mels: 16  # whole number, 1 or more (GUI range 1-128)
  n_mfcc: 13  # whole number, 1 up to n_mels (GUI range 1-60)
  mel_preset: speech  # speech | music | general

# Phoneme surprisal / cohort entropy parameters.
phoneme_surprisal:
  analysis_sr: 128  # Hz, greater than 0 (GUI range 1-1000)
  strip_stress: true
  primary_only: true

# Forced-alignment options (MFA G2P for out-of-dictionary words).
alignment:
  g2p_oov: false
