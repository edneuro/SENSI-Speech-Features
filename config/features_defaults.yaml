# Predictability roster: models (slugs), metrics, per-model context caps.
predictability:
  models: []  # list of model names: any of gpt2, llama32_3b, llama3_8b, llama3_70b, e.g. [gpt2]; the llama* models need a HuggingFace token
  metrics:  # surprisal / cloze / topmatch: true or false each
    surprisal: false
    cloze: false
    topmatch: false
  context: {}  # optional per-model limit on preceding context, in tokens, e.g. {gpt2: 512}; 128 up to the model's window (gpt2 1024, llama32_3b 131072, llama3_8b 8192, llama3_70b 8192); {} = full window

# Semantic-indicator backend + category multi-selects.
semantic:
  backend: empath  # auto | empath | liwc (auto = empath; liwc needs your own .dic in data/dictionaries/)
  categories_liwc:  # list of LIWC category names (used only with backend: liwc)
  - affect
  - cogproc
  - emo_pos
  - emo_neg
  - body
  - motion
  - percept
  - time
  - space
  - work
  - family
  - money
  - relig
  - focuspresent
  - social
  categories_empath:  # list of Empath category names (Empath's built-in list)
  - friends
  - philosophy
  - positive_emotion
  - negative_emotion
  - body
  - movement
  - hearing
  - anticipation
  - science
  - work
  - family
  - communication
  - money

