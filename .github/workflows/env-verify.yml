name: env-verify

on:
  push:
    branches: [main]
    paths-ignore: ['**.md', 'docs/**']
  pull_request:
    paths-ignore: ['**.md', 'docs/**']

jobs:
  verify:
    name: ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        shell: bash -el {0}
    env:
      MKL_THREADING_LAYER: sequential
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      # linux-64's torch pulls ~5 GB of nvidia-*-cu12 CUDA wheels (GPU support
      # for Sherlock), which overflows the runner's ~14 GB disk. Reclaim space
      # by dropping preinstalled toolchains conda doesn't use. Linux only —
      # these paths are Ubuntu-runner specific.
      - name: Free disk space (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo rm -rf /usr/local/lib/android /opt/ghc /usr/local/.ghcup \
                      /usr/share/dotnet /opt/hostedtoolcache/CodeQL
          df -h /

      # PySide6/Qt dlopens system graphics libs (libEGL, libGL, ...) at import,
      # even under QT_QPA_PLATFORM=offscreen. Bare Ubuntu runners lack them
      # (Windows/macOS ship their own). Linux only.
      - name: Install Qt runtime libs (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3

      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: ""

      - name: Install conda-lock
        run: conda install -n base -c conda-forge conda-lock -y

      - name: Install env from the committed lock
        # Force plain conda (not mamba/micromamba) for the install: under CI's
        # mamba the pip layer silently failed to land on Windows (spaCy missing
        # despite exit 0). conda's run/pip path is the battle-tested one, and
        # installing from an explicit lock doesn't need mamba's solve speed.
        run: conda-lock install --no-mamba --no-micromamba -p ./env conda-lock.yml

      - name: Download spaCy model
        run: conda run -p ./env python -m spacy download en_core_web_sm

      - name: Import smoke (env installs AND imports on this OS)
        run: conda run -p ./env python scripts/import_smoke.py

      - name: bitsandbytes absent on macOS (Darwin marker honored)
        if: matrix.os == 'macos-latest'
        run: |
          conda run -p ./env python -c "import importlib.util, sys; \
          sys.exit(0 if importlib.util.find_spec('bitsandbytes') is None else 1)"
