[pytest]
; Scope collection to the test suite. Without this, a bare `pytest` from the
; repo root recurses into env/ (site-packages tests), data/hf_cache/, and data/mfa_data/
; (whose Kaldi work files can be OS-locked/unreadable and abort collection).
testpaths = tests
norecursedirs = env data dev sherlock .git .claude .superpowers __pycache__
