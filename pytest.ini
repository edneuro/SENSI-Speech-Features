[pytest]
; Scope collection to the test suite. Without this, a bare `pytest` from the
; repo root recurses into env/ (site-packages tests), hf_cache/, and mfa_data/
; (whose Kaldi work files can be OS-locked/unreadable and abort collection).
testpaths = tests
norecursedirs = env hf_cache mfa_data sherlock dictionaries .git __pycache__
