name: sensi
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # MFA's Kaldi engine. setup.bat/setup.sh set CONDA_OVERRIDE_CUDA="" so the
  # solver picks the CPU Kaldi build — the CUDA build pulls ~3 GB of NVIDIA/MAGMA
  # libraries that forced alignment never uses (it is CPU-only). If you run
  # `conda env create -f environment.yml` directly, set CONDA_OVERRIDE_CUDA=""
  # first, or you will get the bloated CUDA build.
  - montreal-forced-aligner
  - pip
  - pip:
    - spacy>=3.7
    - wordfreq>=3.0
    - num2words>=0.5
    - tgt>=1.4.4
    - transformers>=4.30
    - torch>=2.0
    - pandas>=2.0
    - PySide6>=6.6
    - tiktoken>=0.6
    - pytest-qt>=4.4
