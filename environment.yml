name: sensi
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Pin Kaldi (MFA's engine) to its CPU build. With a GPU present conda otherwise
  # resolves the CUDA build, pulling ~3 GB of NVIDIA + MAGMA libraries that forced
  # alignment never uses (it is CPU-only). `cpu_*` is the conda-forge CPU variant;
  # a dry-run confirmed this pin drops cuda-cudart/nvrtc/magma from the solve.
  # (This pin, not an env var, is the fix — it is shell-independent.)
  - kaldi=*=cpu_*
  - montreal-forced-aligner
  - pip
  # NOTE: the full Python dependency set is intentionally NOT duplicated here.
  # requirements.txt is the single source of truth for pip deps; setup.sh /
  # setup.bat run `pip install -r requirements.txt` right after this env is
  # created. (Previously this file listed a subset that silently drifted out of
  # sync with requirements.txt, leaving fresh installs missing librosa,
  # parselmouth, gensim, etc.)
