name: sensi
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.10
  # Pin Kaldi (MFA's engine) to its CPU build. With a GPU present conda otherwise
  # resolves the CUDA build, pulling ~3 GB of NVIDIA + MAGMA libraries that forced
  # alignment never uses (it is CPU-only). `cpu_*` is the conda-forge CPU variant;
  # a dry-run confirmed this pin drops cuda-cudart/nvrtc/magma from the solve.
  # (This pin, not an env var, is the fix — it is shell-independent.)
  - kaldi=*=cpu_*
  - montreal-forced-aligner
  - pip
  - pip:
    - spacy>=3.7
    - wordfreq>=3.0
    - num2words>=0.5
    - tgt>=1.4.4
    - transformers>=4.30
    - torch>=2.0
    - pandas>=2.0
    - PySide6>=6.6
    - tiktoken>=0.6
    - pytest-qt>=4.4
